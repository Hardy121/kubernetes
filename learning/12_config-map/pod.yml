kind: Pod
apiVersion: v1
metadata:
  name: configmap-volume

spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]

    volumeMounts:
    - name: config-volume
      mountPath: /etc/config

  volumes:
    - name: config-volume
      configMap:
        name: blog-config
