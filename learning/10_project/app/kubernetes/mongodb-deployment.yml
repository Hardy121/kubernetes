kind: Deployment
apiVersion: apps/v1
metadata:
  name: mongodb
  namespace: blog-app
  labels:
    app: mongodb
    tier: database

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mongodb
      tier: database
  
  template:
    metadata:
      labels:
        app: mongodb
        tier: database

    spec:
      priorityClassName: high-priority
      containers:
        - name: mongodb
          image: mongo:8.0
          ports:
            - containerPort: 27017

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "500Mi"
