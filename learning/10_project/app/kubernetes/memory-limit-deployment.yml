kind: Pod
apiVersion: v1
metadata:
  name: memory-test
  namespace: blog-app

spec:
  containers:
    - name: stress
      image: polinux/stress

      resources:
        requests:
          memory: "64Mi"

        limits:
          memory: "128Mi"

      args: 
        - "--vm"
        - "1"
        - "--vm-bytes"
        - "256M"
        - "--vm-hang"
        - "1"

