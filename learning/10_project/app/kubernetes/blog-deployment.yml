kind: Deployment
apiVersion: apps/v1

metadata:
  name: blog-deployment
  namespace: blog-app
  labels:
    app: blog-app
    tier: backend

spec:
  replicas: 2
  selector:
    matchLabels:
      app: blog-app
      tier: backend

  template:
    metadata:
      labels:
        app: blog-app
        tier: backend
    spec:
      priorityClassName: high-priority
      containers:
        - name: blog-application
          image: blog-app:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000
          
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits: 
              cpu: "500m"
              memory: "256Mi" 

          startupProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
