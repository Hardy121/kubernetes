kind: PersistentVolume
apiVersion: v1
metadata:
  name: local-pv

spec:
  capacity: 
    storage: 2Gi

  accessModes:
    - ReadWriteOnce

  storageClassName: local-storage

  local:
    path: /mnt/disks/ssd1

  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
              - kind-cluster-worker
        


