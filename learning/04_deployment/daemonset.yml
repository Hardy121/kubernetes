kind: DaemonSet 
apiVersion: apps/v1
metadata: 
  name: daemon-deployment
  namespace: nginx
spec: 
  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      name: nginx-demn-pod
      labels:
        app: nginx

    spec: 
      containers:
      - name: nginx
        image: nginx:latest
        ports:
          - containerPort: 80  
