kind: Deployment
apiVersion: apps/v1
metadata: 
  name: frontend-deployment
  namespace: chat-app

spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-app
      tier: frontend

  template:
    metadata:
      name: frontend-deployment
      labels:
        app: chat-app
        tier: frontend
    
    spec:
      containers:
        - name: frontend
          image: hardik002/chatapp-frontend:latest
          ports:
          - containerPort: 80
          env:
          - name: NODE_ENV
            value: production
    